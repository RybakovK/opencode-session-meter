name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle is up to date
        run: git diff --exit-code -- dist
      - name: Readmes are linked
        run: |
          test -f README.ru.md
          grep -q 'README.ru.md' README.md
          grep -q 'README.md' README.ru.md

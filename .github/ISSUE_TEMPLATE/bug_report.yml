name: Bug report
description: Something in the meter is wrong or missing.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, what you saw, and whether the header showed the fallback text.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: OpenCode Desktop version, plugin version or commit.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Speed and sparkline
        - Context or cache numbers
        - Compaction
        - Alerts
        - Settings or commands
        - Installation
    validations:
      required: true

name: Feature request
description: Suggest a metric, mode or integration.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What should the meter show or do?
      description: Describe the user-visible outcome, not the implementation.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it help?
      description: Which decision would it change while you work?
    validations:
      required: false
